---
name: CICD Workflow
on:
  push:
    branches:
      - dev
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      frontend_tag: ${{ steps.set_output.outputs.frontend_tag}}
      backend_tag: ${{ steps.set_output.outputs.backend_tag}}
    steps:
      - name: Code Check out
        uses: actions/checkout@v2
      - name: Set up Docker
        uses: docker/setup-buildx-actions@v2
      - name: Cache Docker layers
        uses: actions/cache@v2
        with:
          path: ~/.cache/buildx
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-
      - name: Install dependencies frontend
        working-directory: ./frontend
        run: |
          npm install
      - name: Install dependencies backend
        working-directory: ./backend
        run: |
          npm install 
      - name: Dockerhub login
        run: >
          docker login --username abinaya251 --password ${{ secrets.TOKEN }}
      - name: Build backend image
        id: backend_build
        run: >
          BACKEND_TAG="tet1"

          docker build -t abinaya251/backend:$BACKEND_TAG -f ./backend/dockerfile-backend ./backend

          docker push abinaya251/backend:$BACKEND_TAG
      - name: Build frontend image
        id: frontend_build
        run: >
          FRONTEND_TAG="tet1"

          docker build -t abinaya251/frontend:$FRONTEND_TAG -f ./frontend/dockerfile-frontend ./frontend

          docker push abinaya251/frontend:$FRONTEND_TAG
      - name: Getoutput for deploy
        id: set_output
        run: >
          echo "::set-output name=frontend_tag::${{
          steps.frontend_build.outputs.FRONTEND_TAG }}"

          echo "::set-output name=backend_tag::${{ steps.backend_build.outputs.BACKTEND_TAG }}"
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy job
        uses: easingthemes/ssh-deploy@main
        env:
          SSH_PRIVAE_KEY: ${{ secrets.EC2_PRIVATE_KEY }}
          HOST: ${{ secrets.EC2_HOST }}
          USERNAME: ${{ secrets.EC2_USERNAME }}
      - name: Setup ssh
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_PRIVATE_KEY }}" >> ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts
      - name: ssh
        uses: appleboy/ssh-action@master
        with: null
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          port: 22
      - name: copy .env
        run: scp -o StrictHostKeyCheckinh=no docker-compose.yaml .env ${{
          secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}:/home/${{
          secrets.EC2_USERNAME }}
      - name: run
        run: >
          ssh -o StrictHostKeyCheckinh=no ${{ secrets.EC2_USERNAME }}@${{
          secrets.EC2_HOST }} "cd /home/ubuntu && docker-compose up -d"
